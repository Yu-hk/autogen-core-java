# ============================================================
# autogen-core-java 运行配置
#
# 这是打进 jar 的默认值。要改配置，不要去改 jar 里的这份，
# 在启动目录放一个同名的 agent.properties 即可——它会覆盖同名项；
# 或者用 -Dagent.config=D:/path/agent.properties 指定路径。
#
# 【密钥不要写在这个文件里】它会被打进 jar、进版本库。两种正确做法：
#   1. 环境变量：export TOOL_BAIDU_AK=xxx（下面的占位符 ${TOOL_BAIDU_AK:} 会自动取）
#   2. 本机覆盖层：启动目录放一个 agent.local.properties，写上真实值即可（已 gitignore）
# 占位符语法：${NAME} 取系统属性/环境变量，${NAME:默认值} 取不到时用默认值。
#
# 临时覆盖（优先级最高）：-Dmodel.name=xxx 或环境变量 MODEL_NAME=xxx
# ============================================================

# ---------- 服务 ----------
# 监听端口；# 默认只绑回环（127.0.0.1）。要对外提供必须同时配下面两条之一：
#   -Dserver.host=0.0.0.0 + server.auth-token=<口令>
#   -Dserver.host=0.0.0.0 + server.auth-allow-anonymous=true（前面已有反代做统一登录时）
server.port=8097

# 访问口令。非空时所有 /api/* 都要求带 Authorization: Bearer <token>（页面会提示输入、
# SSE 用 ?token=）。留空 = 不鉴权，此时代码只允许绑定回环地址，绑 0.0.0.0 会直接拒绝启动。
# 环境变量：SERVER_AUTH_TOKEN
server.auth-token=

# 显式放行「对外监听但不鉴权」。只给「前面已有反向代理做 SSO」的场景，开了启动日志会持续告警。
server.auth-allow-anonymous=false

# 同时在跑的任务数上限（超出的请求立刻收到 429，不排队）。
# 纯 CPU 上单任务 3–9 分钟，默认 2 已经是这台机器的极限；有 GPU 或走云端模型可以调大。
web.max-concurrent-runs=2

# 多轮对话最多同时保留多少段上下文（超出按最久未追问的淘汰）。
# 一段对话存的是全部消息，几十段也才几 MB；淘汰只是移出内存缓存，
# 磁盘上还在，用户再问一句会从磁盘读回来（见下面 web.conversation-store）。
web.max-conversations=32

# 会话持久化：file = 落到 web.data-dir/conversations/<id>.json（默认）；none = 纯内存。
# 落盘解决三件事：重启后能接着聊、容器滚动发布不丢上下文、被内存淘汰的旧对话还能捡回来。
web.conversation-store=file

# 会话保留天数对应的时长（小时）。过期文件在服务启动时清掉。
# 对话里通常有真实代码片段和业务数据，不适合无限期留着。
web.conversation-ttl-hours=168

# 需要跨重启保留的数据目录（会话、以及将来的审计日志）。
# 容器部署必须把它挂成卷，否则换镜像数据就跟着没了。
web.data-dir=target/data

# 结构化日志（JSONL，一行一条，按天切分）目录。
# access-<日期>.jsonl = 每个 HTTP 请求一行（含 traceId / 状态码 / 耗时）
# run-<日期>.jsonl    = 每次运行的 start / note / done / error
# 用 jq 就能按 requestId 把一次请求的全链路捞出来：jq -c 'select(.requestId=="ab12cd34")' *.jsonl
web.log-dir=target/logs

# 关掉只保留控制台可读日志（容器里接不了文件时用）
web.structured-log=true

# 会话快照目录，相对路径以启动目录为基准
server.snapshot-dir=target/snapshots

# 是否下发 HSTS。默认关：内网多是 http，一旦浏览器记住 HSTS，再用 http 访问会被拦成错误页。
# 只有确实跑在 HTTPS 反代后面时才打开。
server.hsts=false

# ---------- 模型 ----------
# ollama   = 本机 Ollama（走 OpenAI 兼容端点 /v1，不出网、不花钱）
# deepseek = 云端 DeepSeek（需要在下面填 api-key）
#
# 切到 DeepSeek 就两步：model.provider 改成 deepseek，再把 api-key 填上
# （或启动前 export DEEPSEEK_API_KEY=sk-xxx，不落盘更安全）。
# 实测对比（2026-10-26，同一份百度 AK、同一个"三景点+美食+公交"任务）：
#   deepseek-chat  7 次工具 10 秒 / 1317 字，坐标、排序、美食表、路线四段齐全，缺数据会明说
#   本地 qwen2.5:7b 2 次工具 77 秒 / 357 字，只答了美食，景点坐标与路线丢失
model.provider=ollama

# 留空 = 按 provider 自动取默认值，这样切 provider 只需改上一行 + 填 Key：
#   ollama   -> http://127.0.0.1:11434/v1
#   deepseek -> https://api.deepseek.com/v1
# 只有走网关/代理、或换自建端点时才需要显式填写。
model.base-url=

# 留空 = 按 provider 自动取默认值：
#   ollama   -> qwen2.5:7b   （其他本地模型以 `ollama list` 为准，需显式填写）
#   deepseek -> deepseek-chat（等价于 deepseek-flash）
# 实测 2026-10：deepseek-v4-pro 也可用，代码/推理任务可显式填它。
model.name=

# Ollama 不校验，留空即用占位值；DeepSeek 必填
# 建议不要写进文件，用环境变量 DEEPSEEK_API_KEY 或 MODEL_API_KEY 更安全
model.api-key=

# 采样温度。留空 = 按 provider 取默认值（ollama 0.3 / deepseek 0.7）
# 本地 7B 建议不超过 0.4，否则群聊容易不按格式输出终止词
model.temperature=

# 单次模型调用超时（秒）。留空 = 按 provider 取默认值（ollama 300 / deepseek 90）
# 7B 跑在纯 CPU 上单轮几十秒很常见，本地不要调小
model.timeout-seconds=

# 单次模型调用失败后的重试次数。默认 1，填 0 = 完全不重试。
# 只对"再试一次可能就行"的错误重试（429 限流、5xx、超时、连接被重置）；
# 401 鉴权错、400 参数错这类重试一百次也一样，直接失败。
# 排查"这个错是偶发还是必然"时设成 0：重试会把偶发错误藏起来。
# 注意：流式输出只要已经推出过一个字就不再重试——重来会让页面出现两遍同样的半句话。
model.max-retries=1

# 重试前的等待基数（毫秒），第 n 次重试等 n 倍。默认 800
model.retry-backoff-ms=800

# ---------- 第二套模型：总结阶段 ----------
# 只给「分工流水线」场景用：上面那套负责调工具查数据，这套负责把资料包写成最终回答。
# model.summarizer.name 留空 = 不启用，该场景第 2 棒回退主模型（等于一个模型干两遍）。
#
# 为什么值得拆开：实测本地 7B 单独跑旅游任务时工具全部调通，但回答只覆盖了其中一段——
# 瓶颈在"把多份工具结果汇总成一段话"，不在工具链。拆开后各管一段：
#   收集 = 云端快模型（工具调用准、10 秒查完 7 项）
#   总结 = 本地大模型（不需要工具，只按素材组织语言、排版、取舍）
# 注意：分工不改变"能不能编"这件事。总结侧的提示词必须明确禁止补充资料包以外的数据，
# 否则它会把"未查到"悄悄填成常识。实测见 README 第十四章。
#
# 选哪一档（同一任务实测）：留空 → 两棒都走主模型，13 秒 / 885 字，比单 agent 只慢 3 秒，
# 却能把"只要 3 家"这种约束守住；换成下面的 20B → 117 秒 / 634 字，慢 9 倍且信息更少。
# 也就是说换模型本身不提升总结质量，只在"数据不许出网 / 想省 token"这类硬约束下才值得。
model.summarizer.provider=ollama
model.summarizer.base-url=
model.summarizer.name=gpt-oss:20b
model.summarizer.api-key=

# 20B 纯 CPU 写一千多字，单轮可能超过 5 分钟，别沿用小模型的超时
model.summarizer.timeout-seconds=600

# 总结要稳：低温度，避免它自作主张改写数字
model.summarizer.temperature=0.4

# ---------- 编码工具 ----------
# 默认工作目录（沙箱）。页面上选了本地目录时，以页面选的为准，这里是"没选时用哪个"。
# 默认放在 target 下，`mvn clean` 可整个清掉，不会在源码树里留模型造的临时工程。
# 想让它在某个固定项目里干活又不想每次点选，就把这里指向那个项目。
tool.code.workspace=target/code-workspace

# 允不允许在页面上选本机目录当工作目录（默认 true）。
# 只能在「白名单」内选：tool.code.workspace / writable-dirs / read-only-dirs 三者之一
# 或其子目录。页面不再显示盘符和用户主目录，白名单外的路径会被 403 拒掉——
# 「点一下选择框」不等于授权，服务对外提供时任何访问者都能构造这个参数。
# 想选别的工程，把它的目录写进下面两个列表（重启生效）。
tool.code.allow-select=true

# 额外允许「只读」的目录，逗号或分号分隔，绝对路径。
# 用途：一边改项目 A，一边要参考项目 B 的代码。
# 只影响读——read_file / read_dir / list_files / search_code 认这些目录，
# write_file / edit_file 永远不认；读得到不等于改得动（要改就在页面上选它）。
# 默认空：不给配置就什么外部目录都读不到（安全默认）。
# 例：tool.code.read-only-dirs=D:/workspace/docs,D:/workspace/frontend
tool.code.read-only-dirs=

# 额外允许「写入」的目录（默认空）。正常用法是页面上选工作目录，不需要配这个。
# 它的场景是"一次要改两个仓库"：选一个当工作目录，另一个挂在这里。
# 例：tool.code.writable-dirs=D:/workspace/abrspro2/frequencyAnaly
# 本机常用：整个 abrspro2 当可写工作区（页面上选它才不会被白名单 403）
tool.code.writable-dirs=D:/workspace/abrspro2

# 写保护（默认 true）：edit_file 和"覆盖已存在文件"的 write_file 必须带 expected_sha256，
# 也就是模型必须先 read_file 拿到哈希再改。文件在"读完之后被别人改过"会被当场拦下，
# 而不是被静默覆盖。关掉就是普通的字符串替换（省一次调用，但失去这个保护）。
tool.code.write-protect=true

# 单条命令的默认超时（秒）。mvn/gradle/npm/node 这类默认 300（真实工程一次全量编译就 60s+），
# 其余默认取这个值。模型可以在调用时覆盖，上限 300。
tool.code.command-timeout-seconds=120

# 能跑的命令有白名单（javac/java/mvn/node/python/git 等），不是黑名单：
# 黑名单永远漏（cmd /c rd /s /q、powershell -enc…），白名单漏了只是少个工具。
# 白名单在 Platform 里按平台/ shell 分三份（通用 / cmd 专有 / POSIX 专有），这里不开放配置
# ——放开配置等于放开删除文件的能力。
#
# 平台是自动识别的（os.name）：Windows 用 cmd（chcp 65001），Linux/macOS 用 sh。
# 模型可以在单次调用里传 shell="powershell" 或 shell="bash"（装了 Git Bash 才行）。
# 想让命令工具按另一个平台组装（调试/演示用）：-Dtool.code.platform=linux

# ---------- 数据库工具 ----------
# 编码场景另外挂 4 个数据库工具：db_connections / db_schema / db_query / db_execute。
# 用途是把"SQL 列名靠猜"变成"先查结构、再真跑一遍"，代码落盘之前 SQL 已经验证过。
#
# 内置沙箱：H2 文件库，落在 <工作目录>/.db/sandbox，AUTO_SERVER 让 run_command 里起的
# Java 进程也能连同一个库（写成 jdbc:h2:file:<路径>;AUTO_SERVER=TRUE 即可）。
# 沙箱永远可写：建表、插数据、改结构随便造，删掉文件就重来。
tool.db.sandbox-url=
tool.db.sandbox-user=sa
tool.db.sandbox-password=

# 真实库默认只读（只能 db_query / db_schema），要写必须显式打开这个开关。
# 打开前想清楚：这套工具没有回滚、没有事务边界，模型的一条 UPDATE 就是真的。
tool.db.allow-write=false

# 单次查询最多返回多少行（模型可下调，上限 200）。表大时靠 WHERE/LIMIT，不靠加大这个值。
tool.db.max-rows=50

# 单条 SQL 的执行超时（秒）
tool.db.query-timeout-seconds=20

# 要连的真实库：逗号分隔的连接名，下面按 <name>.url / username / password / driver / note 配。
# 没登记的名字连不上——模型给的是连接名，拼不出任意 jdbc url，这是刻意的一层边界。
#
# 例子（把注释去掉即可）：
# tool.db.connections=mysql-local,pg-local
# tool.db.mysql-local.url=jdbc:mysql://127.0.0.1:3306/test?useSSL=false&serverTimezone=Asia/Shanghai
# tool.db.mysql-local.username=root
# tool.db.mysql-local.password=
# tool.db.mysql-local.note=本机 MySQL 的 test 库，只有 t_order 一张空表
#
# tool.db.pg-local.url=jdbc:postgresql://127.0.0.1:5432/postgres
# tool.db.pg-local.username=postgres
# tool.db.pg-local.password=
# tool.db.pg-local.note=本机 PostgreSQL
#
# 达梦示例（驱动 jar 需要自己放进 target/lib 或 classpath，Maven 中央仓库没有）：
# tool.db.dm-local.url=jdbc:dm://127.0.0.1:5236
# tool.db.dm-local.username=SYSDBA
# tool.db.dm-local.password=
# tool.db.dm-local.driver=dm.jdbc.driver.DmDriver
tool.db.connections=

# ---------- 工具 ----------
# 工具产生的本地文件（静态地图 png、行程笔记 md）
tool.notes-dir=target/notes

# 抓网页（DuckDuckGo 搜索、马蜂窝景点）的单次超时（秒）
tool.http-timeout-seconds=20

# 地图服务商：amap（高德） / baidu（百度）
#
# 两家在本项目里是等价可换的：同一批工具名、同一套返回值字段，
# 坐标系统一 GCJ-02、坐标顺序统一「经度,纬度」。换 provider 只改这一行 + 填对应 Key，
# 工具提示词和模型行为都不用动（百度那层由 BaiduClient 内部做 bd09/gcj02 与 lat,lng 的转换）。
tool.map.provider=baidu

# ---------- 高德 ----------
# 高德开放平台 Web 服务 Key —— 旅游工具里的地理编码、周边搜索、公交路径规划、静态地图都要它。
#
# 申请步骤（2026-10 实测路径）：
#   1. 注册/登录 https://lbs.amap.com/
#   2. 进控制台 https://console.amap.com/dev/key/app
#   3. 「应用管理」→「我的应用」→ 右上角「创建新应用」，名称随意，类型选「其他」
#   4. 在该应用下点「添加 Key」，【服务平台必须选「Web服务」】——选成 JS API / Android 会报
#      USERKEY_PLAT_NOMATCH，这是最常见的坑
#   5. 复制生成的 Key 填到下面（个人开发者 Web 服务约有免费日配额，够调试）
#
# Key 不写在这里：用环境变量 TOOL_AMAP_KEY，或写进 agent.local.properties（不进版本库）。
tool.amap.key=${TOOL_AMAP_KEY:}

# 高德接口根地址。一般不用改，只有在走网关/代理时才有意义
tool.amap.base-url=https://restapi.amap.com

# 高德请求超时（秒）
tool.amap.timeout-seconds=20

# ---------- 百度 ----------
# 百度地图开放平台 AK。要启用须把上面的 tool.map.provider 改成 baidu。
#
# 申请步骤：
#   1. 注册/登录 https://lbsyun.baidu.com/
#   2. 控制台 https://lbsyun.baidu.com/apiconsole/key → 「创建应用」
#   3. 【应用类型选「服务端」】——选「浏览器端」会报 status=220 Referer 校验失败，
#      选「Android/iOS」会报 203 APP 类型错误
#   4. 该应用下「添加 AK」，勾选需要的服务：地理编码、地点检索、公交路线规划、静态图
#   5. AK 有两种校验方式，二选一：
#        · IP 白名单：填本机/服务器的出口 IP；家用宽带是动态 IP，变了就会报 status=210
#        · SN 校验：需要在请求里加 sn 签名，本项目未实现，不要选这个
#      测试阶段可以填 0.0.0.0/0 放开（会降低安全性，仅限本地调试）
#
# 注意配额（个人开发者，2026-10 官方「开发者权益」页）：地理编码 5000/日、路线规划 5000/日、
# 静态图 5000/日，但【地点检索只有 100 次/日】——旅游场景里周边搜索与景点降级都吃这个额度，
# 调试时容易撞 302 天配额超限。额度不够可做个人开发者认证或换高德。
#
# Key 不写在这里：用环境变量 TOOL_BAIDU_AK，或写进 agent.local.properties（不进版本库）。
tool.baidu.ak=${TOOL_BAIDU_AK:}

# 百度接口根地址
tool.baidu.base-url=https://api.map.baidu.com

# 百度请求超时（秒）
tool.baidu.timeout-seconds=20

# 景点工具每次最多抓几个景点的详情页（每个景点一次请求，越大越慢）
tool.attractions.max-spots=5

# 景点数据源：
#   auto     先抓马蜂窝（字段全：简介/游玩时长/开放时间），失败自动退到地图 POI
#   mafengwo 只抓马蜂窝。实测它的 WAF 会对纯 HTTP 客户端返回 202 挑战页，
#            原 Python 版是为了过这一关才上的 Selenium，Java 版没引浏览器依赖
#   poi      只用地图 POI 检索（稳定、带坐标，但没有开放时间和游玩时长）；
#            具体走高德还是百度，由 tool.map.provider 决定
#   amap     同 poi，旧配置值的兼容写法
tool.attractions.provider=auto

# 网络搜索工具用的引擎：
#   bing 抓 cn.bing.com，国内直连可用，无需 Key（默认）
#   ddg  抓 DuckDuckGo，即原 Python 版的行为，国内一般需要代理
tool.search.provider=bing
